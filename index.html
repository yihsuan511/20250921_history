<!DOCTYPE html>
<html lang="zh-TW">
<head>
 <meta charset="UTF-8">
 <title>歷史訂單</title>
 <style>
   body { font-family:'Helvetica Neue', Arial,sans-serif; background:#f7f7f7; margin:0; padding:10px; }
   .header { display:flex; align-items:center; background:#fff; padding:12px 24px; box-shadow:0 4px 6px rgba(0,0,0,0.1); border-bottom:2px solid #eee; position:sticky; top:0; z-index:1000; }
   .logo { font-size:20px; font-weight:bold; color:#333; }
   h1 { text-align:center; color:#333; font-size:24px; margin:20px 0; }
   .container { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:10px; box-shadow:0 4px 8px rgba(0,0,0,0.1); }
   .order-card { background:#fafafa; padding:15px; margin-bottom:15px; border-radius:8px; border:1px solid #eee; cursor:pointer; }
   .order-card h3 { margin:0; font-size:18px; color:#333; display:flex; justify-content:space-between; align-items:center; }
   .order-details { display:none; margin-top:10px; padding-left:15px; }
   .order-details ul { margin:0; padding-left:20px; }
   .order-details li { margin:5px 0; color:#555; }
 </style>
</head>
<body>
 <div class="header">
   <div class="logo">吃得飽牛肉麵</div>
 </div>


 <h1>歷史訂單</h1>


 <div class="container" id="orderList">載入中...</div>


 <script>
   // 添加這兩個缺失的函數
   function formatDate(dateString) {
     try {
       const date = new Date(dateString);
       if (isNaN(date.getTime())) {
         return dateString;
       }
       return date.toLocaleString('zh-TW', {
         year: 'numeric',
         month: '2-digit',
         day: '2-digit',
         hour: '2-digit',
         minute: '2-digit'
       });
     } catch (e) {
       console.warn('日期格式化錯誤:', e);
       return dateString || '未知時間';
     }
   }


   function getStatusText(status) {
     const statusMap = {
       'pending': '處理中',
       'completed': '已完成',
       'waiting': '等候中',
       'cancelled': '已取消'
     };
     return statusMap[status] || status || '未知';
   }
   async function getOrders() {
     try {
       const phone = new URLSearchParams(window.location.search).get('phone');
       const res = await fetch(`https://two0250811-2.onrender.com/api/orders/${phone}`); // 後端 API
       if (res.status === 401) {
         alert("請先登入！");
         window.location.href = "login.html";
         return;
       }


       const data = await res.json();
       const orderList = document.getElementById("orderList");
       orderList.innerHTML = "";


       if (data.length === 0) {
         orderList.innerHTML = "<p>目前沒有歷史訂單</p>";
         return;
       }


       data.forEach(order => {
         const card = document.createElement("div");
         card.className = "order-card";


         const title = document.createElement("h3");
         title.textContent = `訂單 #${order.order_id} | 日期: ${new Date(order.created_at).toLocaleString()} | 總價: $${order.total_price}`;
         card.appendChild(title);


         const details = document.createElement("div");
         details.className = "order-details";


         const ul = document.createElement("ul");
         order.items.forEach(item => {
           const li = document.createElement("li");
           li.textContent = `${item.item_name} x ${item.quantity} ($${item.price})`;
           ul.appendChild(li);
         });


         details.appendChild(ul);
         card.appendChild(details);


         title.addEventListener("click", () => {
           details.style.display = details.style.display === "none" ? "block" : "none";
         });


         orderList.appendChild(card);
       });


     } catch (err) {
       console.error(err);
       document.getElementById("orderList").textContent = "載入歷史訂單失敗";
     }
   }
 async function loadOrders() {
     try {
       const phone = new URLSearchParams(window.location.search).get('phone');
       if (!phone) {
         document.getElementById("orderList").innerHTML = '<div class="error">未提供電話號碼</div>';
         return;
       }


       console.log('查詢手機號碼:', phone);
      
       // 更新API端點，移除localhost，使用相對路徑或你的實際域名
       const apiUrl = `https://two0250811-2.onrender.com/api/orders/${phone}`;
       console.log('API URL:', apiUrl);
      
       const res = await fetch(apiUrl);
       console.log('HTTP狀態:', res.status);
      
       if (!res.ok) {
         throw new Error(`HTTP ${res.status}: ${res.statusText}`);
       }


       const data = await res.json();
       console.log('收到資料:', data);
      
       const container = document.getElementById('orderList');
       container.innerHTML = "";


       if (!data.success) {
         container.innerHTML = `<div class="error">錯誤: ${data.error || '查詢失敗'}</div>`;
         return;
       }


       if (!Array.isArray(data.orders) || data.orders.length === 0) {
         container.innerHTML = '<div class="no-orders">目前沒有歷史訂單</div>';
         return;
       }


       data.orders.forEach(order => {
         const div = document.createElement('div');
         div.className = "order-card";
        
         const header = document.createElement('h3');
         header.textContent = `訂單編號 #${order.id} | 下單時間: ${formatDate(order.created_at)} | 總金額: $${order.total_price}`;


// 建立按鈕
const toggleBtn = document.createElement("button");
toggleBtn.textContent = "查看明細 ▼";
toggleBtn.style.marginLeft = "10px";
toggleBtn.style.fontSize = "16px";


// 點擊按鈕切換展開/收合
toggleBtn.addEventListener("click", () => {
 const isVisible = details.style.display === "block";
 details.style.display = isVisible ? "none" : "block";
 toggleBtn.textContent = isVisible ? "查看明細 ▼" : "收合明細 ▲";
});


// 把按鈕加到 header
header.appendChild(toggleBtn);
div.appendChild(header);


// 明細區域
const details = document.createElement("div");
details.className = "order-details";
details.style.display = "none"; // 預設隱藏


let detailsHtml = `<p>桌號 / 外帶: ${order.table_number}</p>`;
detailsHtml += `<p>狀態: ${getStatusText(order.status)}</p>`;


if (order.items && Array.isArray(order.items)) {
 detailsHtml += '<p><strong>訂單明細:</strong></p><ul>';
 order.items.forEach(item => {
   const itemName = item.item_name || item.name || '未知項目';
   const quantity = item.quantity || 1;
   const price = item.price || 0;
   detailsHtml += `<li>${itemName} x ${quantity} ($${price})</li>`;
 });
 detailsHtml += '</ul>';
}


details.innerHTML = detailsHtml;
const reorderBtn = document.createElement("button");
reorderBtn.textContent = "再次訂購";
reorderBtn.style.display = "block";
reorderBtn.style.marginTop = "15px";
reorderBtn.style.fontSize = "16px";
reorderBtn.style.padding = "8px 16px";
reorderBtn.style.backgroundColor = "#66b";
reorderBtn.style.color = "white";
reorderBtn.style.border = "none";
reorderBtn.style.borderRadius = "5px";
reorderBtn.style.cursor = "pointer";


reorderBtn.addEventListener("click", () => {
  // 把餐點存到 localStorage
  localStorage.setItem("reorderItems", JSON.stringify(order.items));
  console.log("已存入 localStorage:", order.items);

  // 取得上次所在頁面
  const lastPage = sessionStorage.getItem("lastPage");

  // 根據記錄跳轉回原頁面，若沒有記錄就預設回內用.html
  if (lastPage) {
    window.location.href = lastPage;
  } else {
    window.location.href = "內用.html";
  }
});

// 加到明細最下面
details.appendChild(reorderBtn);
div.appendChild(details);

// 最後把整張卡片加入
container.appendChild(div);
       });


     } catch (err) {
       console.error('載入歷史訂單失敗:', err);
       document.getElementById('orderList').innerHTML = `<div class="error">載入歷史訂單失敗: ${err.message}</div>`;
     }
   }
window.onload = loadOrders;
 </script>
</body>
</html>
